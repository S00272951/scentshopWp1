<div class="hero-section text-center mb-5">
  <h1 class="display-4 fw-bold mb-3">Find Your Signature Scent</h1>
  <p class="fs-5 mb-0" style="color:#777;">Fragrances and skincare</p>
</div>

<h4 class="mb-4 fw-bold" style="border-left: 4px solid #b8860b; padding-left:12px;">All Products</h4>

<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-5">
  @for (perfume of service.searchResults(); track perfume.id) {
    <div class="col">
      <div class="card h-100 rounded-4 shadow-sm">
        <div class="text-center p-3" style="background:#fdf9f3; border-radius:16px 16px 0 0;">
          <img [src]="perfume.thumbnail" class="rounded" style="height:180px; object-fit:contain;">
        </div>
        <div class="card-body d-flex flex-column">
          <h5 class="card-title mb-1">{{ perfume.title }}</h5>
          <span class="badge brand-badge mb-2" style="width:fit-content;">{{ perfume.brand }}</span>
          <p class="text-muted small mb-3 flex-grow-1">{{ perfume.description }}</p>
          <div class="d-flex justify-content-between align-items-center pt-3" style="border-top:1px solid #eee;">
            <span class="price-tag fs-5">&euro;{{ perfume.price }}</span>
            <button class="btn btn-sm btn-add-cart rounded-pill px-3" 
                    (click)="service.addItem(perfume.title, perfume.brand, perfume.price, perfume.thumbnail, perfume.description)">
              Add to Cart
            </button>
          </div>
        </div>
      </div>
    </div>
  }
</div>
